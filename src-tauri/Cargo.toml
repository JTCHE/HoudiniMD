[workspace]
members = ["crates/wiki"]

[package]
name = "houdinimd"
version = "0.1.0"
description = "Version-exact Houdini documentation, offline and local."
authors = ["JTCHE"]
edition = "2024"
rust-version = "1.85"
# `src/bin/probe.rs` is a second binary, so `cargo run` needs to be told which
# one the app is.
default-run = "houdinimd"

[lib]
# The desktop binary and any future test harness both link this.
name = "houdinimd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
wiki = { version = "0.1.0", path = "crates/wiki" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rayon = "1.12.0"
tiny_http = "0.12.0"
include_dir = "0.7.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Foundation"] }
