[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "houdinimd-docs"
description = "Parses Houdini's help, written in SideFX's own wiki markup, into clean Markdown, and indexes it for ranked full-text search."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "JTCHE" }]
keywords = ["houdini", "documentation", "sidefx", "markdown", "parser", "full-text-search"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://houdinimd.com"

[tool.maturin]
module-name = "houdinimd_docs"
features = ["pyo3/extension-module"]
